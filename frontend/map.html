<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Info – MapSearch</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #viewer-section {
      position: relative;
      width: 100%;
      height: 500px;
      background: #080a0f;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 1rem;
    }
    #viewer-section canvas { display: block; }
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #080a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }
    #loading-overlay p { color: var(--muted); }
    #loading-overlay.hidden { display: none; }
    #error-msg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .5rem;
      color: var(--danger);
      z-index: 10;
      background: #080a0f;
    }
    #error-msg.visible { display: flex; }
    #viewer-controls {
      position: absolute;
      bottom: .5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      font-size: .75rem;
      color: var(--muted);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <nav>
    <span class="brand">🗺 MapSearch</span>
    <a href="index.html">Search</a>
  </nav>

  <div class="container" id="app">
    <div class="spinner"></div>
  </div>

  <!-- Three.js from CDN (r128 is the last release that ships examples/js/) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="app.js"></script>
  <script src="viewer.js"></script>
  <script>
    const BASE = window.BASE_URL || "";
    const params = new URLSearchParams(location.search);
    const mapPath = params.get("path");
    const app = document.getElementById("app");

    if (!mapPath) {
      app.innerHTML = '<p class="empty">No map specified.</p>';
    } else {
      loadMap(mapPath);
    }

    async function loadMap(path) {
      try {
        const [map, filesData] = await Promise.all([
          fetchJSON(`${BASE}/api/maps/${encodeURIComponent(path)}`),
          fetchJSON(`${BASE}/api/maps/${encodeURIComponent(path)}/files`).catch(() => ({ files: [] })),
        ]);
        render(map, filesData.files || []);
      } catch (err) {
        app.innerHTML = `<p class="empty">Error loading map: ${escHtml(err.message)}</p>`;
      }
    }

    function render(map, files) {
      const imageUrl = `${BASE}/api/maps/${encodeURIComponent(map.map_path)}/image`;
      const tags = (map.tags || []).map((t) => `<span class="tag">${escHtml(t.tag_name)}</span>`).join("");
      const filesList = files.length
        ? files
            .map(
              (f) =>
                `<li>
                  <span class="dot${f.available ? "" : " missing"}"></span>
                  <code>${escHtml(f.path)}</code>
                  ${f.available ? "" : '<span style="color:var(--danger);font-size:.8rem">missing</span>'}
                </li>`
            )
            .join("")
        : `<li style="color:var(--muted)">No file information available.</li>`;

      app.innerHTML = `
        <a class="back-link" href="index.html">← Back to search</a>

        <div class="map-header">
          <img src="${imageUrl}" alt="${escHtml(map.map_name)}" />
          <div class="map-meta">
            <h1>${escHtml(map.map_name)}</h1>
            <p class="message">${escHtml(map.message || "No description available.")}</p>
            ${tags ? `<div class="map-card"><div class="card-body"><div class="card-tags">${tags}</div></div></div>` : ""}
            <div class="map-actions">
              <a class="btn" href="${BASE}/api/maps/${encodeURIComponent(map.map_path)}/download" download>
                ⬇ Download ZIP
              </a>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>3D View</h2>
          <div id="viewer-section">
            <div id="loading-overlay">
              <div class="spinner"></div>
              <p id="loading-msg">Loading BSP…</p>
            </div>
            <div id="error-msg">
              <p id="error-text">Failed to load map.</p>
            </div>
            <canvas id="viewer-canvas"></canvas>
            <div id="viewer-controls">
              <span>🖱 Left-drag: rotate</span>
              <span>🖱 Right-drag / scroll: zoom</span>
              <span>🖱 Middle-drag: pan</span>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Required Files</h2>
          <ul class="files-list">${filesList}</ul>
        </div>
      `;

      initViewer(BASE, map.map_path);
    }
  </script>
</body>
</html>
